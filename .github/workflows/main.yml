name: Pipeline CI/CD DevSecOps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Pruebas Microservicio Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar pruebas PyTest con cobertura
        run: |
          cd microservicio-python
          pip install -r requirements.txt
          pytest --cov=src --cov-report=xml:coverage.xml

      # 2. Pruebas Microservicio Java
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas Maven y JaCoCo
        run: |
          cd microservicio-java
          mvn clean test

      # 3. Análisis SAST con SonarCloud
      - name: Escaneo SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 4. Análisis SCA con Snyk
      - name: Escaneo de vulnerabilidades Snyk
        uses: snyk/actions/python-3.10@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 5. Verificación de construcción Docker
      - name: Probar Docker Compose
        run: |
          docker compose build